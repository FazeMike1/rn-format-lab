name: Format Report

# Mirrors react-native's format-report.yml: privileged workflow_run consumer of the
# (attacker-controlled) artifact. Posts to the PR named in the artifact metadata.
on:
  workflow_run:
    workflows: [Format]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    # NOTE: lab has no repo-slug guard (real repo guards github.repository).
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Check out trusted reporter
        uses: actions/checkout@v4
      - name: Download formatting report (attacker-controlled artifact)
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: format-results
          path: .format-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment on formatting failures
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const reportFormattingErrors = require('./.github/workflow-scripts/reportFormattingErrors');
            await reportFormattingErrors({github, context, core});
